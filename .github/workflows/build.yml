name: Build & Release

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ExcellentEconomy-Folia
          path: build/libs/ExcellentEconomy-*.jar
          if-no-files-found: error

      - name: Get project version
        if: github.event_name == 'push'
        id: version
        run: |
          VERSION=$(grep -oP "version\s*=\s*\"\K[^\"]*" build.gradle.kts)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ExcellentEconomy-Folia ${{ steps.version.outputs.tag }}
          body: |
            ExcellentEconomy with Folia support - ${{ steps.version.outputs.tag }}

            Built from commit ${{ github.sha }}
          files: build/libs/ExcellentEconomy-*.jar
          make_latest: true
          generate_release_notes: true
